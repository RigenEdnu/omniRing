name: Build & CI Check

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  check-and-build:
    runs-on: windows-latest
    env:
      RUST_BACKTRACE: 1

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Create logs directory
        run: mkdir -p logs
        shell: bash

      - name: Install Frontend Dependencies
        run: npm install 2>&1 | tee logs/npm-install.log
        shell: bash

      - name: Typecheck Frontend
        run: npx tsc --noEmit 2>&1 | tee logs/typecheck.log
        shell: bash

      - name: Build Frontend
        run: npm run build 2>&1 | tee logs/frontend-build.log
        shell: bash

      - name: Cargo Check
        run: |
          cd src-tauri
          cargo check --verbose 2>&1 | tee ../logs/cargo-check.log
        shell: bash

      - name: Build Tauri App
        run: npx tauri build --no-bundle 2>&1 | tee logs/tauri-build.log
        shell: bash

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: omniring-windows-x64
          path: |
            src-tauri/target/release/*.exe
            src-tauri/target/release/*.dll
          if-no-files-found: warn

      - name: Upload Error Logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-error-logs
          path: logs/
          if-no-files-found: warn
